name: Redrob Copilot — CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  verify-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python 3.10 ───────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ── 3. PyTorch CPU first (custom index) ───────────────
      - name: Install PyTorch CPU
        run: |
          pip install torch==2.2.2+cpu torchvision==0.17.2+cpu \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-cache-dir

      # ── 4. All other requirements ─────────────────────────
      - name: Install requirements
        run: pip install -r requirements.txt --no-cache-dir

      # ── 5. Verify environment (offline — no API key in CI) ─
      - name: Verify install
        run: python verify_install.py --offline

      # ── 6. Download + cache models ────────────────────────
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('requirements.txt') }}
          restore-keys: hf-models-

      - name: Bundle models (offline verify if cached)
        run: python scripts/bundle_models.py --verify-only || python scripts/bundle_models.py

      # ── 7. Validate submission CSV if it exists ───────────
      - name: Validate submission CSV
        run: |
          if [ -f "data/processed/submission.csv" ]; then
            python validate_submission.py --file data/processed/submission.csv
          else
            echo "No submission.csv found — skipping validation"
          fi

      # ── 8. Run unit tests ─────────────────────────────────
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short || echo "No tests directory yet"
